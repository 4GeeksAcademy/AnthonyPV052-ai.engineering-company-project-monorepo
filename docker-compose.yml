services:
  backend:
    build:
      context: .
      dockerfile: services/Dockerfile
    container_name: brasaland-backend
    volumes:
      - ./services/api:/app
      - ./services/reporting:/app/reporting
      - ./data:/app/data
      - /app/.venv
    ports:
      - "8020:8020"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - APP_BASE_URL=http://frontend:3000
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - LLM_GATEWAY=${LLM_GATEWAY}
      - LLM_API_KEY=${LLM_API_KEY}
      - EMBED_MODEL=${EMBED_MODEL}
      - GEN_MODEL=${GEN_MODEL:-litellm/madrid-spain/openrouter/deepseek/deepseek-v4-flash}
      - EMBED_MODEL=${EMBED_MODEL}
    networks:
      - brasaland-net
    depends_on:
      - redis
      - qdrant
    command: ["uv", "run", "uvicorn", "main:app", "--reload", "--port", "8020", "--host", "0.0.0.0"]

  worker:
    build:
      context: .
      dockerfile: services/Dockerfile
    container_name: brasaland-worker
    volumes:
      - ./services/api:/app
      - ./services/reporting:/app/reporting
      - ./data:/app/data
      - /app/.venv
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - LLM_GATEWAY=${LLM_GATEWAY}
      - LLM_API_KEY=${LLM_API_KEY}
      - EMBED_MODEL=${EMBED_MODEL}
      - GEN_MODEL=${GEN_MODEL:-litellm/madrid-spain/openrouter/deepseek/deepseek-v4-flash}
      - EMBED_MODEL=${EMBED_MODEL}
    depends_on:
      - redis
      - qdrant
    networks:
      - brasaland-net
    command: ["uv", "run", "celery", "-A", "celery_app", "worker", "--loglevel=INFO"]

  qdrant:
    image: qdrant/qdrant:v1.15.5
    container_name: brasaland-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - brasaland-net

  redis:
    image: redis:7-alpine
    container_name: brasaland-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    networks:
      - brasaland-net

  flower:
    image: mher/flower:2.0
    container_name: brasaland-flower
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - brasaland-net
    command: ["celery", "--broker=redis://redis:6379/0", "flower", "--port=5555"]

  frontend:
    build:
      context: ./uis
      dockerfile: Dockerfile
    container_name: brasaland-frontend
    volumes:
      - ./uis/website:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - WATCHPACK_POLLING=true
      - API_UPSTREAM_URL=http://backend:8020
    depends_on:
      - backend
    networks:
      - brasaland-net
    command: ["npx", "next", "dev", "--webpack", "-p", "3000"]

networks:
  brasaland-net:
    name: brasaland-net
    driver: bridge

volumes:
  qdrant_storage: