services:
  backend:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: brasaland-backend
    volumes:
      - ./services/api:/app
      - /app/.venv
    ports:
      - "8020:8020"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:3000}
      - SMTP_HOST=${SMTP_HOST:-smtp-relay.brevo.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_LOGIN=${SMTP_LOGIN}
      - SMTP_KEY=${SMTP_KEY}
      - SMPT_KEY=${SMPT_KEY}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
    networks:
      - brasaland-net
    command: ["uv", "run", "uvicorn", "main:app", "--reload", "--port", "8020", "--host", "0.0.0.0"]

  frontend:
    build:
      context: ./uis
      dockerfile: Dockerfile
    container_name: brasaland-frontend
    working_dir: /app/website
    volumes:
      - ./uis/website:/app/website
      - /app/website/node_modules
      - ./src:/app/src
    ports:
      - "3000:3000"
    environment:
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    networks:
      - brasaland-net
    command: ["node_modules/.bin/next", "dev", "-p", "3000"]

networks:
  brasaland-net:
    name: brasaland-net
    driver: bridge