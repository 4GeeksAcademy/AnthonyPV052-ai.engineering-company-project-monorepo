[project]
name = "services-api"
version = "0.1.0"
description = "Brasaland Supplier Directory API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "tinydb>=4.8.0",
  "pydantic[email]>=2.8.0",
  "python-jose[cryptography]>=3.5.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt==4.0.1",
]

[project.scripts]
seed = "seed:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["."]
include = [
  "seed.py",
  "main.py",
  "models.py",
  "database.py",
  "security.py",
  "email_service.py",
  "auth_models.py",
  "users_service.py",
  "routes/*.py",
]
